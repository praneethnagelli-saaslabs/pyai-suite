<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PyAI Suite</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">P</span>
          <strong>PyAI Suite</strong>
        </div>
        <div id="meet-chip" class="chip">Not in Meet</div>
      </div>
      <div id="status"></div>

      <section class="card">
        <h2>CallIQ</h2>
        <div class="row">
          <button id="calliq" class="btn" disabled>Send bot</button>
          <button id="start-with-bot" class="btn secondary">New Meet</button>
        </div>
        <p id="meet-url" class="meet"></p>
      </section>

      <section class="card">
        <h2>Brief</h2>
        <div class="row">
          <button id="brief-capture" class="btn secondary" disabled>Capture</button>
          <button id="brief-open" class="btn ghost">Open Meet</button>
        </div>
      </section>

      <section class="card">
        <h2>Scrib</h2>
        <textarea id="raw" placeholder="Speak or paste…"></textarea>
        <div class="row">
          <button id="mic" class="btn secondary">Hold to talk</button>
          <button id="go" class="btn">Clean + insert</button>
        </div>
      </section>

      <p id="scrib-hint" class="hint">Hold <kbd>Control+Shift+1</kbd> (⌃ not ⌘), speak, release to paste</p>
      <p class="hint"><a href="#" id="scrib-shortcuts">Change shortcut</a> · hold the button, or allow the mic once</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
