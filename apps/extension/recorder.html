<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scrib</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="recorder">
      <div class="brand">
        <span class="mark" aria-hidden="true">S</span>
        <strong>Scrib</strong>
      </div>
      <div id="status" class="status">Allow the mic, then Start.</div>
      <div class="row" style="margin-top: 8px">
        <button id="toggle" class="btn">Start</button>
        <button id="insert" class="btn secondary" disabled>Insert</button>
      </div>
      <p class="hint">If blocked: chrome://settings/content/microphone</p>
    </div>
    <script src="wav-encode.js"></script>
    <script src="recorder.js"></script>
  </body>
</html>
